---
# 
# Install OpenCTI And OpenAEV
# 

#
# The install flow is a plain sequence of includes without `when`:
# in ansible-core 2.16, a `when` on include_tasks is evaluated in the
# included task context, where variables registered by parent tasks
# are not visible, which makes such conditions unreliable.
- name: Install container engine and dependencies
  ansible.builtin.include_tasks:
    file: engine.yml

- name: Create installation directory and copy files
  ansible.builtin.include_tasks:
    file: core.yml

- name: Pull images and start the stack
  ansible.builtin.include_tasks:
    file: filigram.yml
