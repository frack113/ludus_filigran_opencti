# tasks/filigram.yml
---

- name: Pull Filigran images individually (docker, max 2 at a time)
  community.docker.docker_image:
    name: "{{ item }}"
    source: pull
  loop: "{{ filigran_images }}"
  throttle: 2
  ignore_errors: yes
  register: pull_results
  when: filigran_container_engine == 'docker'

- name: Check which Filigran images are already present (podman)
  ansible.builtin.command:
    argv: ["podman", "image", "exists", "{{ item }}"]
  loop: "{{ filigran_images }}"
  register: filigran_image_exists
  failed_when: false
  changed_when: false
  when: filigran_container_engine == 'podman'

- name: Set list of Filigran images to pull (podman)
  ansible.builtin.set_fact:
    filigran_images_to_pull: >-
      {{ filigran_image_exists.results
         | selectattr('rc', 'ne', 0)
         | map(attribute='item')
         | list }}
  when: filigran_container_engine == 'podman'

- name: Pull Filigran images individually (podman)
  ansible.builtin.command:
    argv: ["podman", "pull", "{{ item }}"]
  loop: "{{ filigran_images_to_pull | default([]) }}"
  register: pull_results
  failed_when: false
  changed_when: true
  when: filigran_container_engine == 'podman'

- name: Warning about failed image pulls
  debug:
    msg: "WARNING: Failed to pull image {{ item.item }}"
  loop: "{{ pull_results.results }}"
  when: item.failed
  loop_control:
    label: "{{ item.item }}"

- name: Start Filigran stack (docker)
  community.docker.docker_compose_v2:
    project_src: "{{ ludus_filigran_opencti_INSTALL_DIR }}"
    state: present
    wait: true
    wait_timeout: 240
    pull: missing
  register: compose_result
  when: filigran_container_engine == 'docker'

- name: Start Filigran stack (podman)
  ansible.builtin.command:
    chdir: "{{ ludus_filigran_opencti_INSTALL_DIR }}"
    argv: ["podman", "compose", "-f", "docker-compose.yml", "up", "-d"]
  register: compose_result
  when: filigran_container_engine == 'podman'

- name: Fail if compose failed to start services
  meta: end_host
  when: compose_result is defined and compose_result.failed

- name: Install python3-requests (uri module dependency)
  ansible.builtin.package:
    name: python3-requests
    state: present

- name: Wait until Filigran HTTP status is 200
  uri:
    url: 'http://localhost:8080/'
    return_content: yes
    validate_certs: no
    status_code:
      - 200
  until: uri_output.status == 200
  retries: 36
  delay: 10
  register: uri_output
  when: compose_result is defined and not compose_result.failed
